<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <div class="header">
      <div class="brand">Chisa Translate <span class="brand-ext">Extension</span></div>
      <span class="version">v1.1</span>
    </div>

    <div class="status-card">
      <span id="status-text" class="status-title">Enabled</span>
      <label class="switch">
        <input type="checkbox" id="toggle-state" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="actions-grid">
      <div class="action-item" title="Click DL on any image to send to Chisa Translate App">
        <span class="badge dl">DL</span>
        <span class="action-label">Send App</span>
      </div>
      <div class="action-item" title="Click TL on any image to translate in-place on webpage">
        <span class="badge tl">TL</span>
        <span class="action-label">Translate</span>
      </div>
    </div>

    <a href="https://www.chisa.id/download" target="_blank" class="bottom-btn download-btn"
      title="Download Chisa Translate App">
      <svg class="btn-icon download-icon" width="14" height="14" viewBox="0 0 24 24">
        <path d="M19,9H15V3H9V9H5L12,16L19,9M5,20H19V18H5V20Z" />
      </svg>
      <span class="btn-text">Download Chisa Translate</span>
    </a>

    <a href="https://trakteer.id/indravoyager" target="_blank" class="bottom-btn trakteer-btn"
      title="Support Chisa Translate developer on Trakteer">
      <svg class="btn-icon heart-icon" width="14" height="14" viewBox="0 0 24 24">
        <path
          d="M12,21.35L10.55,20.03C5.4,15.36 2,12.28 2,8.5C2,5.42 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.42 22,8.5C22,12.28 18.6,15.36 13.45,20.03L12,21.35Z" />
      </svg>
      <span class="btn-text">Support on Trakteer</span>
    </a>
  </div>
  <script src="popup.js"></script>
</body>

</html>
